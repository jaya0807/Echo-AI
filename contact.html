<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Echo-AI</title>
    <meta name="description" content="Get in touch with Echo-AI.">
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements"></div>

    <header class="navbar">
        <div class="logo">Echo-AI</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="nav-spacer"></div>
    </header>

    <main>
        <section id="contact" class="contact fade-in" style="padding-top: 150px; min-height: 80vh;">
            <div class="section-header">
                <h2>Get in Touch</h2>
                <p>Have questions? We'd love to hear from you</p>
            </div>
            <div class="contact-container glass">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="John Doe" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="john@example.com" required />
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer glass">
        <div class="footer-grid">
            <div class="footer-col">
                <div class="footer-logo">Echo-AI</div>
                <p class="footer-desc">A multimodal approach to preliminary Parkinson's screening</p>
            </div>
            <div class="footer-col">
                <h4>Explore</h4>
                <ul class="footer-links">
                    <li><a href="index.html#home">Home</a></li>
                    <li><a href="features.html">Features</a></li>
                    <li><a href="index.html#about">About</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4>Support</h4>
                <ul class="footer-links">
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="#">Privacy Policy</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Echo-AI All rights reserved</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
